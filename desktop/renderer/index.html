<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src http://127.0.0.1:* http://localhost:*"
    />
    <title>KOT Bridge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand">
          <span class="brand-dot" id="brand-dot" aria-hidden="true"></span>
          <div class="brand-text">
            <h1>KOT Bridge</h1>
            <p class="brand-sub" id="engine-label">Starting…</p>
          </div>
        </div>
        <div class="header-meta">
          <span class="meta" id="port-label">:5001</span>
        </div>
      </header>

      <section class="panel">
        <div class="row">
          <div>
            <p class="label">Auto-print engine</p>
            <p class="value muted" id="backend-status">—</p>
          </div>
          <button type="button" class="toggle" id="engine-toggle" role="switch" aria-checked="true">
            <span class="toggle-thumb"></span>
          </button>
        </div>
        <div class="row printer-row">
          <div>
            <p class="label">Printer</p>
            <p class="value" id="printer-status">—</p>
          </div>
          <div class="printer-actions">
            <label class="mini-select">
              <span class="sr-only">Printer status</span>
              <select id="printer-select">
                <option value="ready">ready</option>
                <option value="offline">offline</option>
                <option value="paper_out">paper out</option>
              </select>
            </label>
            <button type="button" class="btn primary" id="btn-test">Test print</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <p class="label">Accounts &amp; sessions</p>
          <span class="meta" id="session-count">0 active</span>
        </div>
        <div class="sessions" id="sessions">
          <p class="empty">Sessions are tracked by the Chrome extension. Orders from each account appear in the print feed below.</p>
        </div>
      </section>

      <section class="panel grow">
        <div class="panel-head">
          <p class="label">Print feed</p>
          <button type="button" class="text-btn" id="btn-clear">Clear</button>
        </div>
        <div class="feed" id="feed">
          <p class="empty">No tickets yet.</p>
        </div>
      </section>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
